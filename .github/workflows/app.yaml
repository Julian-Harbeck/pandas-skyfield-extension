name: pandas-skyfield-extension

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  test:
    strategy:
      matrix:
        os: ["ubuntu-latest"]
        environment: [py311, py312, py313, py314, no-optional, minimum-versions, pandas-nightly, pue-nightly, skyfield-nightly]
        include:
          - os: windows-latest
            environment: py314

          - os: macos-latest
            environment: py314
      fail-fast: false

    runs-on: ${{ matrix.os }}

    name: ${{ format('Unit Tests - {0} - {1}', matrix.os, matrix.environment) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create virtual environment with Pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.78.0
          cache: true
          environments: ${{ matrix.environment }}
          # Need to use unlocked and frozen because of different index for pandas dependency
          # and pandas-nightly, see https://github.com/prefix-dev/pixi/issues/6834
          locked: false
          frozen: true

      - name: Run pytest
        run: pixi run -e ${{ matrix.environment }} tests

  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: pre-commit/action@v3.0.1

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.2"
          python-version: "3.14"
          enable-cache: true

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Build
        run: uv build
